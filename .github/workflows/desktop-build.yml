# 打 tag（v*）时自动构建 macOS / Windows / Linux 安装包并发布到 GitHub Releases。
# 发布后，网页里「桌面组件」的下载直链（/releases/latest/download/PetLink-Desktop-*）即可用。
name: Desktop Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build & publish desktop app
        run: npm run electron:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 云同步：把 Supabase 密钥注入构建，桌面 App 才能登录并与网页版跨设备同步。
          # 在 GitHub 仓库 Settings → Secrets and variables → Actions 配置这两个 secret。
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
